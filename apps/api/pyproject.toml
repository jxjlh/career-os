[project]
name = "career-os-api"
version = "0.1.0"
description = "Career OS FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "pyjwt>=2.9,<3",
  "cryptography>=43,<45",
  "websockets>=12,<18",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "alembic>=1.13,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",
  "DTZ003",
  "DTZ011",
  "BLE001",
  "RUF012",
  "S112",
  "FURB162",
  "RUF001",
  "RUF002",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
