# nginx 配置 —— Next.js 静态导出 + API 反向代理
# 静态文件由 nginx 直接提供，/api/* 和 /media/* 代理到 Render API 服务

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    # ── API 反向代理 ──
    # 将 /api/* 请求代理到 Render API 服务，绕过 CORS
    location /api/ {
        proxy_pass https://ai-life-os-api-4y3x.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host ai-life-os-api-4y3x.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
    }

    # ── 媒体文件反向代理 ──
    # 将 /media/* 请求代理到后端，后端负责返回存储的图片/文件
    location /media/ {
        proxy_pass https://ai-life-os-api-4y3x.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host ai-life-os-api-4y3x.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
    }

    # ── 静态资源缓存 ──
    # Next.js 静态资源带 hash 文件名，可长期缓存
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA Fallback ──
    # Next.js 静态导出生成 /path/index.html，trailingSlash: true
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ── 健康检查 ──
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
