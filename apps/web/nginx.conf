# nginx 配置 —— Next.js 静态导出 + API 反向代理
# 静态文件由 nginx 直接提供，/api/* 代理到 Render API 服务

# API 后端地址（通过环境变量注入，默认为 Render API 服务）
# nginx 不支持运行时环境变量，所以这里硬编码 API 地址
# 如果 API 地址变化，需要更新此配置并重新构建

upstream api_backend {
    server ai-life-os-api-4y3x.onrender.com:443;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── API 反向代理 ──
    # 将 /api/* 请求代理到 Render API 服务，绕过 CORS
    location /api/ {
        proxy_pass https://ai-life-os-api-4y3x.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host ai-life-os-api-4y3x.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
    }

    # ── 静态资源缓存 ──
    # Next.js 静态资源带 hash 文件名，可长期缓存
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA Fallback ──
    # Next.js 静态导出生成 /path/index.html，trailingSlash: true
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ── 健康检查 ──
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
