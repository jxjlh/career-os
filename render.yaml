# Render Blueprint —— AI Life OS 全栈（前端 Next.js + 后端 FastAPI）
# 零 Vercel：前后端都部署到 Render（免费档），共用同一套 Blueprint。
# 部署：Render Dashboard → New → Blueprint → 连接 GitHub 仓库 → 自动读取本文件。
# 所有敏感值用 sync: false，部署时在 Render 控制台填写（不写入仓库）。
# 强制重新部署：修改此文件或创建空提交均可触发 Render 自动部署。
services:
  # ---------- 后端 API（Docker + FastAPI + 自动 Alembic 迁移）----------
  - type: web
    name: ai-life-os-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    # 仅在 GitHub CI 全部通过后才开始生产部署。
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      # 生产必填的敏感变量（需在 Render 控制台 Environment 里填写，绝不入库）。
      # DATABASE_URL: 从 Supabase → Project Settings → Database → Connection string
      # 选 "Pooler connection string"（端口 6543，含 ?pgbouncer=true）
      # 形如：postgresql://postgres:<密码>@<host>.supabase.co:6543/postgres?pgbouncer=true&sslmode=require
      #      （注意：密码里的 + / = 等特殊字符要 URL-encode，例如 @ → %40，+ → %2B）
      - key: DATABASE_URL
        sync: false
        # 本地/CI 默认值：避免无 DATABASE_URL 时 fallback 到 sqlite；
        # 生产在 Render 覆盖此值。这里留空表示"必须手动填"，不写死任何真实密码。
        value: ""
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # 重要：SUPABASE_JWT_SECRET 留空（或完全不填）即可。
      # 后端代码检测到它为空时，会自动走 ES256 + JWKS 公钥验证（与 Supabase 默认一致）；
      # 填了旧 HS256 secret 反而会让验证失败。
      - key: SUPABASE_JWT_SECRET
        sync: false
        value: ""
      - key: XFYUN_API_KEY
        sync: false
      - key: XFYUN_API_SECRET
        sync: false
      - key: XFYUN_APP_ID
        sync: false
      - key: SPARK_MODEL
        value: Spark-Lite
      - key: SPARK_WS_URL
        value: wss://spark-api.xf-yun.com/v1.1/chat
      - key: SPARK_DOMAIN
        value: lite

  # ---------- 前端（Next.js 静态导出 + nginx 静态服务 + API 反向代理）----------
  # rootDir 设为 apps/web：前端无 monorepo 内部依赖，构建上下文只需 apps/web 目录。
  # Docker 多阶段构建：Node.js 构建 Next.js 静态导出 → nginx 提供静态文件 + /api/* 代理。
  - type: web
    name: ai-life-os-web
    runtime: docker
    plan: free
    rootDir: apps/web
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    # 仅在 GitHub CI 全部通过后才开始生产部署。
    autoDeployTrigger: checksPass
    envVars:
      - key: API_UPSTREAM
        # 注意：Render 因基础名 ai-life-os-api 被占用，给服务分配了带后缀 -4y3x 的 URL。
        # 不要用 https://ai-life-os-api.onrender.com（那是占位的 503 挂起页）。
        value: https://ai-life-os-api-4y3x.onrender.com
      # NEXT_PUBLIC_* 是浏览器端公开变量（会打进客户端 bundle），非密钥，可直接声明。
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://odthfgmjgutpsfjkmvto.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_ftRAw_nGku7CG49dOwQ05w_-HTMb82N
