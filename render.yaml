# Render Blueprint —— AI Life OS 全栈（前端 Next.js + 后端 FastAPI）
# 零 Vercel：前后端都部署到 Render（免费档），共用同一套 Blueprint。
# 部署：Render Dashboard → New → Blueprint → 连接 GitHub 仓库 → 自动读取本文件。
# 所有敏感值用 sync: false，部署时在 Render 控制台填写（不写入仓库）。
services:
  # ---------- 后端 API（Docker + FastAPI + 自动 Alembic 迁移）----------
  - type: web
    name: ai-life-os-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: XFYUN_API_KEY
        sync: false
      - key: XFYUN_API_SECRET
        sync: false
      - key: XFYUN_APP_ID
        sync: false
      - key: SPARK_MODEL
        value: Spark-Lite
      - key: SPARK_WS_URL
        value: wss://spark-api.xf-yun.com/v1.1/chat
      - key: SPARK_DOMAIN
        value: lite

  # ---------- 前端（Node.js + Next.js 15 standalone，内部 rewrite 代理后端）----------
  # rootDir 必须为仓库根：monorepo 的 packages/* (@career-os/*) 需在构建期可解析。
  # 渲染 Render Node 运行时会读取根 .nvmrc(=Node 20)，避免 @tailwindcss/oxide
  # 因旧版 Node 报 "Cannot find native binding"。NODE_VERSION 作为双保险显式声明。
  - type: web
    name: ai-life-os-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm --workspace apps/web run build
    startCommand: npm --workspace apps/web run start
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: API_UPSTREAM
        # 注意：Render 因基础名 ai-life-os-api 被占用，给服务分配了带后缀 -4y3x 的 URL。
        # 不要用 https://ai-life-os-api.onrender.com（那是占位的 503 挂起页）。
        value: https://ai-life-os-api-4y3x.onrender.com
      # NEXT_PUBLIC_* 是浏览器端公开变量（会打进客户端 bundle），非密钥，可直接声明。
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://odthfgmjgutpsfjkmvto.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_ftRAw_nGku7CG49dOwQ05w_-HTMb82N
