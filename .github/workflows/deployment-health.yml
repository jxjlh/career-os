name: Verify Render deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  health-check:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Wait for the API deployment and verify readiness
        env:
          API_READY_URL: https://ai-life-os-api-4y3x.onrender.com/ready
        run: |
          set -u

          wait_for_healthy_service() {
            service_name="$1"
            service_url="$2"
            attempt=1

            while [ "$attempt" -le 30 ]; do
              status=$(curl --location --silent --show-error --max-time 45 \
                --output /tmp/render-response.json --write-out '%{http_code}' \
                "$service_url" || true)

              if [ "$status" = '200' ]; then
                printf '%s readiness response:\n' "$service_name"
                cat /tmp/render-response.json
                return 0
              fi

              printf '%s not ready yet (attempt %s/30, HTTP %s).\n' \
                "$service_name" "$attempt" "$status"
              cat /tmp/render-response.json 2>/dev/null || true
              sleep 20
              attempt=$((attempt + 1))
            done

            printf '%s did not become healthy. Inspect its Render deployment logs.\n' \
              "$service_name" >&2
            return 1
          }

          wait_for_healthy_service 'Render API' "$API_READY_URL"

      - name: Wait for the web deployment and verify availability
        env:
          WEB_URL: https://ai-life-os-web.onrender.com/
        run: |
          set -u

          wait_for_available_service() {
            attempt=1

            while [ "$attempt" -le 30 ]; do
              status=$(curl --location --silent --show-error --max-time 45 \
                --output /tmp/render-web-response.html --write-out '%{http_code}' \
                "$WEB_URL" || true)

              if [ "$status" = '200' ]; then
                printf '%s\n' 'Render web service is available.'
                return 0
              fi

              printf 'Render web service not ready yet (attempt %s/30, HTTP %s).\n' \
                "$attempt" "$status"
              sleep 20
              attempt=$((attempt + 1))
            done

            printf '%s\n' 'Render web service did not become available. Inspect its Render deployment logs.' >&2
            return 1
          }

          wait_for_available_service
